<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>Taki</title>

        <style>
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            button {
                width: 250px;
                height: 80px;
                font-size: 24px;
            }
            img {
                 width: 479px;
                 height: 497px;
                 margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <img src="taki_face.png" alt="Image">
        <p id="count">Count: 0</p>
        <button onclick="playSound(); countPlus1()">똬잇</button>
        <audio id="taki" src="taki.wav"></audio>

        <script>
            function playSound() {
                const sound = document.getElementById("taki");
                sound.currentTime = 0;
                sound.play();
            }

            let count = 0

            function countPlus1() {
                count = count + 1
                document.getElementById("count").innerHTML = "Count: " + count;
            }
        </script>
    </body>
</html>
